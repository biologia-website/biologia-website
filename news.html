  .news-date{font-size:13px;color:var(--text-muted);}

  .news-card .news-sum{font-size:14px;color:var(--text-muted);line-height:1.7;flex:1;}

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function catClass(c){return c==='行业资讯'?' industry':(c==='技术干货'?' tech':'');}
fetch('data/news.json').then(function(r){return r.json();}).then(function(list){
  var grid=document.getElementById('newsGrid');
  if(!list||!list.length){grid.innerHTML='<p style="color:var(--text-muted);">暂无资讯</p>';return;}
  list.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  grid.innerHTML=list.map(function(n){
    return '<a class="news-card" href="news/'+esc(n.id)+'.html">'+
      '<div class="news-meta"><span class="news-cat'+catClass(n.category)+'">'+esc(n.category||'资讯')+'</span><span class="news-date">'+esc(n.date||'')+'</span></div>'+
      '<h3>'+esc(n.title)+'</h3>'+
      '<p class="news-sum">'+esc(n.summary||'')+'</p>'+
      '<span class="news-more">阅读全文 →</span>'+
    '</a>';
  }).join('');
}).catch(function(e){document.getElementById('newsGrid').innerHTML='<p style="color:var(--text-muted);">资讯加载失败</p>';});
</script>
